name: LazuliNet GUI Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install core + dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q lazulinet run_gui.py scripts/smoke_gui.py

      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest --junitxml="test-results/pytest-${{ matrix.python-version }}.xml"

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-python-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  kivy-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install GUI + dev dependencies
        run: python -m pip install -e '.[gui,dev]'

      - name: Run Kivy smoke test
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          xvfb-run -a python scripts/smoke_gui.py 2>&1 | tee test-results/kivy-smoke.log

      - name: Upload Kivy smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kivy-smoke-log
          path: test-results/kivy-smoke.log
          if-no-files-found: warn
          retention-days: 14

  build-artifacts:
    name: Build distributable artifacts
    runs-on: ubuntu-latest
    needs:
      - core-tests
      - kivy-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Build source snapshot
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          git archive \
            --format=zip \
            --output="dist/Lazuli-pennet-${SHORT_SHA}.zip" \
            HEAD

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload LazuliNet build
        uses: actions/upload-artifact@v4
        with:
          name: lazulinet-build-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
