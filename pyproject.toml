[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lazulinet-gui"
version = "0.2.0"
description = "Shared LazuliNet GUI/core for Debian and Android"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["kivy>=2.3.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
